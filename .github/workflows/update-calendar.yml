name: Update tide and surf calendar
on:
  schedule:
    - cron: "15 */3 * * *"   # every 3 hours
  workflow_dispatch:          # lets you run it by hand from the Actions tab
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Publish the updated calendar
        run: |
          git config user.name "tide-bot"
          git config user.email "tide-bot@users.noreply.github.com"
          git add docs/tides.ics
          git diff --cached --quiet || git commit -m "Update calendar"
          git push
